name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libegl1
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest -q --cov=fedleave --cov=fedleave_gui --cov=annual_leave_chart --cov=sick_leave_chart --cov=fedleave_month_report_graphic --cov-branch --cov-report=term-missing --cov-report=xml

      - name: Generate strict CLI to MCP parity inventory
        run: python -m fedleave.mcp --inventory > mcp-inventory.json

      - name: Record tested runtime dependencies
        run: python scripts/lib/common/dependency_inventory.py --runtime-only --output source-dependencies.json --requirements source-dependencies.txt

      - name: Check resolved runtime advisories
        run: |
          python -m pip install "pip-audit>=2.10,<3"
          python -m pip_audit --strict --disable-pip --no-deps --vulnerability-service osv -r source-dependencies.txt

      - name: Upload runtime dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-dependencies-${{ runner.os }}
          path: source-dependencies.*

      - name: Upload MCP parity inventory
        uses: actions/upload-artifact@v4
        with:
          name: mcp-inventory-${{ runner.os }}
          path: mcp-inventory.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage.xml

  quality:
    name: formatting, linting, typing, and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install developer tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality checks
        run: make quality

      - name: Build source and wheel distributions
        run: make package
