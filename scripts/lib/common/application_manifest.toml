[fedleave]
mode = "console"
hidden_imports = ["fedleave", "holidays", "icalendar"]
collect_all = ["fedleave"]

[FedLeaveCalendar]
mode = "windowed"
icon = "assets/fedleave-icon.ico"
add_data = ["help:help", "assets:assets"]
hidden_imports = [
  "PySide6.QtCore",
  "PySide6.QtGui",
  "PySide6.QtWidgets",
  "PySide6.QtPrintSupport",
  "shiboken6",
  "shiboken6.Shiboken",
]
collect_all = ["shiboken6"]

